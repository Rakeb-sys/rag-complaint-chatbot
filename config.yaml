paths:
  raw_data: "data/complaints.csv"
  processed_data: "data/processed/filtered_complaints.csv"
  vector_store: "vector_store/"
  logs: "logs/app.log"

preprocessing:
  target_products:
    - "Credit card"
    - "Personal loan"
    - "Savings account"
    - "Money transfer"
  sample_size: 10000

chunking:
  chunk_size: 500
  chunk_overlap: 50

models:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  llm_model: "mistralai/Mistral-7B-Instruct-v0.2"

retrieval:
  top_k: 5
  similarity_threshold: 0.35  # Scores below this trigger fallback